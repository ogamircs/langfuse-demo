[project]
name = "langfuse-agent-demo"
version = "0.1.0"
description = "Langfuse-first observability demo: a tool-rich Claude Agent SDK agent (Sonnet) with MCP tools, Streamlit UI and a monitoring dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.2.150,<0.3",
    "langfuse>=4.15,<5",
    "anthropic>=1.0",
    "mcp>=1.23,<3",
    "streamlit>=1.40",
    "duckdb>=1.1",
    "pandas>=2.2",
    "plotly>=5.24",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "opentelemetry-proto>=1.33",
]

[tool.setuptools]
packages = ["agent", "agent.tools", "agent.context", "data", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
